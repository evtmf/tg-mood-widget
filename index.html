<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .cats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .cat-btn {
            font-size: 35px;
            background: var(--tg-theme-button-color, #3390ec);
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .cat-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <h2>Как настроение?</h2>
    <div class="cats">
        <button class="cat-btn" onclick="sendVote('😿')">😿</button>
        <button class="cat-btn" onclick="sendVote('😐')">😐</button>
        <button class="cat-btn" onclick="sendVote('😻')">😻</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        function sendVote(cat) {
            tg.sendData(cat);
            tg.close(); 
        }
    </script>
</body>
</html>
